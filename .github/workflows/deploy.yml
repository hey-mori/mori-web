# Publishes the site to GitHub Pages, which serves mori.swarea.com (public/CNAME).
#
# A push to main deploys main. To roll back, run this workflow by hand with an
# earlier commit or tag as `ref`: the same build is published again and the
# live site returns to it within a minute.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag or branch to publish (default main)
        required: false
        default: main

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the build carries the custom domain
        run: test "$(cat dist/CNAME)" = "mori.swarea.com"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
